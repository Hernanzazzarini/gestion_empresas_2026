# Nginx de producción: sirve el SPA compilado y hace de proxy hacia el server.
server {
    listen 80;
    server_name _;

    # Permite subir archivos (uploads de hasta 20MB en varios módulos)
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API → contenedor del server (nombre de servicio en docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (fotos, PDFs) → los sirve el server estáticamente
    location /uploads/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
